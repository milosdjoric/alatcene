name: Daily Scrape

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC = 06:00 Belgrade
  workflow_dispatch: # manual trigger

# contents: write — za commit manifest-a (keepalive, vidi poslednji korak)
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run all scrapers
        run: node scrape-all.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Match products
        run: node scripts/match-products.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # GitHub gasi zakazane workflow-e posle 60 dana bez aktivnosti u repou
      # (desilo se 03.08.2026 → 57 dana bez scrape-a). Dnevni commit manifest-a
      # je aktivnost, pa se cron ne gasi. Vercel ga preskače (vercel.json).
      - name: Commit manifest (keepalive)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): scrape manifest $(date -u +%F)"
          git pull --rebase
          git push
